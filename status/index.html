<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session Focus</title>
    <style>
      :root {
        color-scheme: light dark;
        --sf-bg: var(--oc-bg, #ffffff);
        --sf-fg: var(--oc-fg, #111111);
        --sf-muted: var(--oc-muted, #6b7280);
        --sf-border: var(--oc-border, #e5e7eb);
        --sf-hover: var(--oc-hover, rgba(0, 0, 0, 0.04));
        --sf-subtle: var(--oc-subtle, #f9fafb);
        --sf-primary: var(--oc-primary, #2563eb);
        --sf-primary-fg: var(--oc-primary-fg, #ffffff);
        --sf-radius: var(--oc-radius, 8px);
        --sf-font: var(--oc-font, system-ui, -apple-system, "Segoe UI", sans-serif);
        --sf-mono: var(--oc-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      }

      html, body { margin: 0; }
      body {
        font-family: var(--sf-font);
        font-size: 12px;
        line-height: 1.45;
        color: var(--sf-fg);
        background: transparent;
      }

      #root { padding: 2px 2px 8px; display: flex; flex-direction: column; gap: 8px; }
      .empty { color: var(--sf-muted); padding: 10px 2px; }

      .divider {
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--sf-muted);
      }

      .focus-input {
        width: 100%;
        box-sizing: border-box;
        resize: none;
        font: inherit;
        font-weight: 600;
        color: var(--sf-fg);
        background: var(--sf-subtle);
        border: 1px solid var(--sf-border);
        border-radius: calc(var(--sf-radius) - 2px);
        padding: 6px 8px;
        min-height: 40px;
      }
      .focus-input:focus { outline: 2px solid var(--sf-primary); outline-offset: -1px; }
      .focus-input.is-empty { font-weight: 400; color: var(--sf-muted); }

      .bar { display: flex; align-items: center; gap: 8px; }
      .bar .track { flex: 1; height: 4px; border-radius: 2px; background: var(--sf-border); overflow: hidden; }
      .bar .fill { height: 100%; width: 0; background: var(--sf-primary); transition: width 160ms ease; }
      .bar .count { flex: none; color: var(--sf-muted); font-variant-numeric: tabular-nums; font-size: 11px; }

      ul.actions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
      li.row { display: flex; gap: 7px; align-items: flex-start; padding: 3px 4px; border-radius: calc(var(--sf-radius) - 3px); }
      li.row:hover { background: var(--sf-hover); }

      .tick {
        flex: none;
        width: 15px;
        height: 15px;
        margin-top: 1px;
        padding: 0;
        border-radius: 4px;
        border: 1.5px solid var(--sf-border);
        background: transparent;
        cursor: pointer;
        display: grid;
        place-items: center;
        color: var(--sf-primary-fg);
        font-size: 10px;
        line-height: 1;
      }
      .tick[data-state="doing"] { border-color: var(--sf-primary); }
      .tick[data-state="doing"]::after {
        content: "";
        width: 7px; height: 7px;
        border-radius: 2px;
        background: var(--sf-primary);
      }
      .tick[data-state="done"] { background: var(--sf-primary); border-color: var(--sf-primary); }
      .tick[data-state="done"]::after { content: "\2713"; }
      .tick[data-state="dropped"] { border-style: dashed; }

      .body { flex: 1; min-width: 0; }
      .text { word-break: break-word; }
      li[data-state="done"] .text { color: var(--sf-muted); text-decoration: line-through; }
      li[data-state="dropped"] .text { color: var(--sf-muted); text-decoration: line-through; font-style: italic; }
      li[data-state="doing"] .text { font-weight: 600; }

      .refs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
      .ref {
        font-family: var(--sf-mono);
        font-size: 10px;
        padding: 0 6px;
        border: 1px solid var(--sf-border);
        border-radius: 999px;
        color: var(--sf-muted);
        background: transparent;
        cursor: pointer;
        text-decoration: none;
      }
      .ref:hover { color: var(--sf-fg); border-color: var(--sf-muted); }

      .row-tools { flex: none; display: flex; gap: 2px; opacity: 0; }
      li.row:hover .row-tools, li.row:focus-within .row-tools { opacity: 1; }
      .icon-btn {
        border: 0; background: transparent; cursor: pointer; padding: 1px 3px;
        color: var(--sf-muted); font-size: 11px; line-height: 1; border-radius: 4px;
      }
      .icon-btn:hover { color: var(--sf-fg); background: var(--sf-hover); }

      .divider { display: flex; align-items: center; gap: 8px; margin: 4px 0 1px; }
      .divider::before, .divider::after { content: ""; height: 1px; background: var(--sf-border); flex: 1; }

      .add-row { display: flex; gap: 6px; align-items: center; }
      .input {
        flex: 1; min-width: 0; box-sizing: border-box; font: inherit; color: var(--sf-fg);
        background: transparent; border: 1px dashed var(--sf-border);
        border-radius: calc(var(--sf-radius) - 2px); padding: 5px 8px;
      }
      .input:focus { outline: none; border-style: solid; border-color: var(--sf-primary); }

      .ref-form { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 4px; margin: 4px 0 2px 22px; }
      .ref-form .input { padding: 3px 6px; font-size: 11px; }
      .save {
        border: 1px solid var(--sf-border); background: var(--sf-subtle); color: var(--sf-fg);
        border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 11px; cursor: pointer;
      }

      .notice {
        border: 1px solid var(--sf-border);
        border-left: 3px solid var(--sf-primary);
        border-radius: 6px;
        padding: 6px 8px;
        color: var(--sf-muted);
      }

      /* ------------------------------------------------------------ status */

      .status-row { display: flex; }
      .status-open {
        display: flex; align-items: flex-start; gap: 6px;
        flex: 1; min-width: 0; text-align: left;
        font: inherit; color: var(--sf-fg); cursor: pointer;
        border: 0; background: transparent;
        padding: 3px 4px; border-radius: calc(var(--sf-radius) - 3px);
      }
      .status-open:hover { background: var(--sf-hover); }
      .status-open svg { flex: none; margin-top: 1px; }
      .status-label { flex: 1; min-width: 0; word-break: break-word; }
      .status-age { flex: none; color: var(--sf-muted); font-size: 10.5px; margin-top: 1px; }
      .status-row[data-empty="true"] .status-open { color: var(--sf-muted); }
      .status-blank { flex: none; width: 16px; text-align: center; }

      /* Tone. The host paints these; the fallbacks only matter outside the app. */
      .status-row[data-tone="primary"] svg,
      .status-option[data-tone="primary"] svg { color: var(--oc-primary, #2563eb); }
      .status-row[data-tone="info"] svg,
      .status-option[data-tone="info"] svg { color: var(--oc-info-text, #2563eb); }
      .status-row[data-tone="warning"] svg,
      .status-option[data-tone="warning"] svg { color: var(--oc-warning-text, #b45309); }
      .status-row[data-tone="error"] svg,
      .status-option[data-tone="error"] svg { color: var(--oc-error-text, #b91c1c); }
      .status-row[data-tone="success"] svg,
      .status-option[data-tone="success"] svg { color: var(--oc-success-text, #15803d); }
      .status-row[data-tone="neutral"] svg,
      .status-row[data-tone="muted"] svg { color: var(--sf-muted); }

      /* Motion says whether anything is actually moving. `loop` is only ever
         applied while the session is busy — see motionFor() in card.ts. */
      @keyframes sf-spin { to { transform: rotate(360deg); } }
      @keyframes sf-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

      .status-row[data-motion="loop"] .status-open svg { animation: sf-spin 2.2s linear infinite; }
      .status-row[data-motion="attention"] .status-open svg { animation: sf-breathe 1.6s ease-in-out infinite; }

      .status-picker {
        display: flex; flex-direction: column; gap: 6px;
        border: 1px solid var(--sf-border);
        border-radius: calc(var(--sf-radius) - 2px);
        padding: 8px; background: var(--sf-subtle);
      }
      .status-options {
        display: flex; flex-direction: column; gap: 1px;
        max-height: 176px; overflow-y: auto;
      }
      .status-option {
        display: flex; align-items: center; gap: 7px;
        font: inherit; color: var(--sf-fg); cursor: pointer; text-align: left;
        border: 0; background: transparent;
        padding: 3px 5px; border-radius: 5px;
      }
      .status-option:hover { background: var(--sf-hover); }
      .status-option[aria-pressed="true"] { font-weight: 600; }
      .status-option svg { flex: none; color: var(--sf-muted); }
      .status-clear {
        align-self: flex-start;
        font: inherit; font-size: 11px; cursor: pointer;
        border: 0; background: transparent; padding: 2px 5px;
        border-radius: 5px; color: var(--sf-muted);
      }
      .status-clear:hover { color: var(--sf-fg); background: var(--sf-hover); }

      @media (prefers-reduced-motion: reduce) {
        .status-row[data-motion="loop"] .status-open svg,
        .status-row[data-motion="attention"] .status-open svg { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
